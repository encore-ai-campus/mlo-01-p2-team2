{% extends "second_project/base.html" %}

{% block title %}로그인 · 인사 요청 검토 가이드{% endblock %}

{% block content %}
<section class="panel narrow">
  <p class="eyebrow">INTERNAL HR GUIDE</p>
  <h1>인사 요청 검토 가이드</h1>
  <p class="lede">승인된 사내 계정으로 로그인해 주세요.</p>

  {% if form.errors %}
    <div class="alert alert-error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</div>
  {% endif %}

  <form method="post" class="stacked-form">
    {% csrf_token %}
    <label for="{{ form.username.id_for_label }}">아이디</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">비밀번호</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button primary">로그인</button>
  </form>
</section>
{% endblock %}
